<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memora — Pilih penggunaan</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#181818;font-family:Arial,sans-serif;min-height:100vh}.page{width:min(760px,calc(100% - 32px));margin:auto;padding:17vh 0 60px}.brand{text-align:center;font:600 42px Georgia}.subtitle{text-align:center;color:#777;font-size:17px;margin:8px 0 40px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px}.choice{border:1px solid #ddd;background:#fff;border-radius:25px;padding:32px;min-height:370px;text-align:left;cursor:pointer;transition:.3s}.choice:hover{transform:translateY(-6px);box-shadow:0 20px 50px #0001}.choice.dark{background:#f0f0ee}.icon{width:66px;height:66px;border-radius:20px;background:#181818;color:#fff;display:grid;place-items:center;font-size:26px;margin-bottom:25px}.badge{display:inline-block;background:#e9e9e7;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:bold;color:#555;margin-bottom:14px}.choice h2{font:500 32px/1.1 Georgia;margin:0 0 15px}.choice p{color:#777;font-size:16px;line-height:1.65}.login{text-align:center;color:#777;margin-top:30px}.login a{font-weight:bold;color:#181818}.back{text-align:center;margin-top:18px;color:#999;font-size:13px}@media(max-width:650px){.page{padding-top:100px}.choices{grid-template-columns:1fr}.choice{min-height:auto}}
</style></head><body><main class="page"><div class="brand">memora</div><div class="subtitle">Kamu mau pakai Memora untuk apa?</div>
<div class="choices">
<button class="choice dark" onclick="go('photographer')"><div class="icon">▣</div><span class="badge">memora · for photographers</span><h2>Untuk Fotografer &amp; Studio</h2><p>Kirim galeri seleksi ke klien, terima pilihan foto mereka, dan kelola prosesnya dengan lebih rapi.</p></button>
<button class="choice" onclick="go('memories')"><div class="icon">♡</div><span class="badge">memora · for memories</span><h2>Untuk Kenangan &amp; Keluarga</h2><p>Simpan foto pernikahan atau momen spesialmu jadi galeri cantik, lalu bagikan ke keluarga.</p></button>
</div><div class="login">Sudah punya akun? <a href="auth.html?mode=signin">Masuk di sini</a></div><div class="back"><a href="index.html">← Kembali ke halaman utama</a></div></main>
<script>function go(type){localStorage.setItem('memora_account_type',type);if(localStorage.getItem('memora_logged_in')==='true'){location.href=type==='photographer'?'dashboard.html':'memories.html'}else{location.href='auth.html?mode=register&type='+type}}</script></body></html>
