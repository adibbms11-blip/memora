<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memora — Buat Galeri</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

:root{
  --bg:#fafaf8;
  --card:#fff;
  --text:#181818;
  --muted:#77736c;
  --border:#e4e1db;
  --soft:#f2f1ee;
  --accent:#b89558;
  --danger:#a33;
}

body.dark{
  --bg:#181817;
  --card:#222220;
  --text:#f5f3ee;
  --muted:#aaa69d;
  --border:#3a3935;
  --soft:#2b2a27;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

header{
  height:70px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  background:var(--bg);
}

.brand{
  font:700 25px Georgia,serif;
  letter-spacing:-1px;
}

.photographer{
  display:inline-block;
  margin-left:8px;
  padding:5px 8px;
  border-radius:6px;
  background:var(--soft);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:10px;
  font-weight:bold;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.email{
  color:var(--muted);
  font-size:13px;
}

.icon{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  border-radius:10px;
  font-size:16px;
}

/* PAGE */

.page{
  width:min(850px,calc(100% - 32px));
  margin:auto;
  padding:55px 0 100px;
}

.back{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:0;
  margin-bottom:25px;
  font-size:14px;
}

.title{
  font-size:34px;
  letter-spacing:-1.2px;
  margin:0;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin:8px 0 30px;
}

/* CARD */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px;
}

.field{
  margin-bottom:22px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

.required{
  color:var(--accent);
  font-size:10px;
  margin-left:5px;
}

input{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(184,149,88,.12);
}

.hint{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin-top:7px;
}

.error,
.success{
  display:none;
  padding:11px 13px;
  border-radius:10px;
  font-size:13px;
  margin-bottom:18px;
}

.error{
  background:#fff1f1;
  border:1px solid #efcccc;
  color:var(--danger);
}

.success{
  background:#eef8f1;
  border:1px solid #c8e4d0;
  color:#337c4d;
}

.save{
  width:100%;
  height:48px;
  border:0;
  border-radius:11px;
  background:#181818;
  color:#fff;
  font-weight:bold;
}

body.dark .save{
  background:#f3f1eb;
  color:#181818;
}

.save:disabled{
  opacity:.6;
}

/* PHOTOS */

#photosSection{
  display:none;
  margin-top:35px;
}

.photos-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.photos-title{
  margin:0;
  font-size:22px;
}

.photo-count{
  color:var(--muted);
  font-size:13px;
}

.photos-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.photo{
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  overflow:hidden;
}

.photo img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:var(--soft);
}

.photo-check{
  position:absolute;
  top:10px;
  left:10px;
  width:25px;
  height:25px;
  margin:0;
  accent-color:#181818;
}

.photo-name{
  padding:10px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.empty{
  grid-column:1/-1;
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
}

@media(max-width:700px){

  header{
    padding:0 15px;
  }

  .email{
    display:none;
  }

  .page{
    padding:40px 0 70px;
  }

  .card{
    padding:22px;
  }

  .photos-grid{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:430px){

  .photographer{
    display:none;
  }

  .photos-grid{
    gap:8px;
  }

}
</style>
</head>

<body>

<header>

  <div>
    <span class="brand">memora</span>
    <span class="photographer">for photographers</span>
  </div>

  <div class="header-right">

    <div class="email" id="email"></div>

    <button class="icon" onclick="toggleTheme()">◐</button>

    <button class="icon" onclick="logout()">↪</button>

  </div>

</header>


<main class="page">

<button class="back" onclick="location.href='dashboard.html'">
  ← Kembali ke Dashboard
</button>

<h1 class="title">
  Buat Galeri
</h1>

<p class="subtitle">
  Buat galeri baru untuk client kamu.
</p>


<div class="card">

  <div id="error" class="error"></div>
  <div id="success" class="success"></div>

  <form id="galleryForm">

    <div class="field">

      <label>
        Nama Client
        <span class="required">WAJIB</span>
      </label>

      <input
        id="clientName"
        type="text"
        placeholder="Contoh: Adit & Shinta"
        maxlength="100"
        required
      >

    </div>


    <div class="field">

      <label>
        Nama Galeri
        <span class="required">WAJIB</span>
      </label>

      <input
        id="galleryName"
        type="text"
        placeholder="Contoh: Wedding Adit & Shinta"
        maxlength="150"
        required
      >

    </div>


    <div class="field">

      <label>
        Link Google Drive
        <span class="required">WAJIB</span>
      </label>

      <input
        id="driveUrl"
        type="url"
        placeholder="https://drive.google.com/drive/folders/..."
        required
      >

      <div class="hint">
        Gunakan link folder Google Drive yang berisi foto.
      </div>

    </div>


    <button
      id="saveBtn"
      class="save"
      type="submit"
    >
      Simpan & Ambil Foto
    </button>

  </form>

</div>


<section id="photosSection">

  <div class="photos-header">

    <h2 class="photos-title">
      Foto Galeri
    </h2>

    <div
      class="photo-count"
      id="photoCount"
    >
      0 foto
    </div>

  </div>

  <div
    id="photosGrid"
    class="photos-grid"
  ></div>

</section>

</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://kluuablkxxanpkdsfckp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_MWrUTn7S0cX1Ff50ebZvFQ_GxtiwiTy";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   GOOGLE DRIVE API KEY
========================================= */

const GOOGLE_DRIVE_API_KEY =
"AIzaSyCNjhG4YaftIllJoRciPB9b7158WAtT3nA";


/* =========================================
   ELEMENTS
========================================= */

const email =
document.getElementById("email");

const galleryForm =
document.getElementById("galleryForm");

const clientName =
document.getElementById("clientName");

const galleryName =
document.getElementById("galleryName");

const driveUrl =
document.getElementById("driveUrl");

const saveBtn =
document.getElementById("saveBtn");

const errorBox =
document.getElementById("error");

const successBox =
document.getElementById("success");

const photosSection =
document.getElementById("photosSection");

const photosGrid =
document.getElementById("photosGrid");

const photoCount =
document.getElementById("photoCount");


let currentUser = null;


/* =========================================
   THEME
========================================= */

function loadTheme(){

  if(
    localStorage.getItem("memora_theme")
    === "dark"
  ){
    document.body.classList.add("dark");
  }

}

function toggleTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "memora_theme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

}

loadTheme();


/* =========================================
   MESSAGE
========================================= */

function showError(message){

  errorBox.textContent = message;
  errorBox.style.display = "block";
  successBox.style.display = "none";

}

function showSuccess(message){

  successBox.textContent = message;
  successBox.style.display = "block";
  errorBox.style.display = "none";

}


/* =========================================
   AUTH
========================================= */

async function checkAuth(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();


  if(error || !data.user){

    location.href =
    "auth.html?type=photographer";

    return;

  }


  currentUser =
  data.user;

  email.textContent =
  currentUser.email || "";

}

checkAuth();


/* =========================================
   DRIVE FOLDER ID
========================================= */

function getDriveFolderId(url){

  const match =
  url.match(
    /\/folders\/([a-zA-Z0-9_-]+)/
  );

  if(match){
    return match[1];
  }


  const idMatch =
  url.match(
    /[?&]id=([a-zA-Z0-9_-]+)/
  );

  if(idMatch){
    return idMatch[1];
  }


  return null;

}


/* =========================================
   GET DRIVE PHOTOS
========================================= */

async function getDrivePhotos(folderId){

  const query =
    `'${folderId}' in parents and trashed = false and mimeType contains 'image/'`;


  const endpoint =
    "https://www.googleapis.com/drive/v3/files" +
    "?q=" +
    encodeURIComponent(query) +
    "&fields=" +
    encodeURIComponent(
      "files(id,name,mimeType,thumbnailLink)"
    ) +
    "&pageSize=1000" +
    "&key=" +
    encodeURIComponent(
      GOOGLE_DRIVE_API_KEY
    );


  const response =
  await fetch(endpoint);


  const result =
  await response.json();


  if(!response.ok){

    throw new Error(
      result?.error?.message ||
      "Google Drive gagal mengirim daftar foto."
    );

  }


  return result.files || [];

}


/* =========================================
   THUMBNAIL
========================================= */

function thumbnail(file){

  if(file.thumbnailLink){

    return file.thumbnailLink
      .replace(/=s\d+/, "=s1200");

  }

  return (
    "https://drive.google.com/thumbnail" +
    "?id=" +
    encodeURIComponent(file.id) +
    "&sz=w1200"
  );

}


/* =========================================
   SAVE PHOTOS
========================================= */

async function savePhotos(
  galleryId,
  files
){

  if(!files.length){
    return;
  }


  const rows =
  files.map(file => ({

    gallery_id:galleryId,

    drive_file_id:file.id,

    file_name:file.name,

    thumbnail_url:thumbnail(file),

    selected:false

  }));


  const {
    error
  } =
  await supabaseClient
    .from("photos")
    .insert(rows);


  if(error){

    throw error;

  }

}


/* =========================================
   RENDER PHOTOS
========================================= */

function renderPhotos(photos){

  photosGrid.innerHTML = "";

  photoCount.textContent =
    `${photos.length} foto`;


  if(!photos.length){

    photosGrid.innerHTML = `
      <div class="empty">
        Tidak ada foto yang ditemukan di folder tersebut.
      </div>
    `;

    return;

  }


  photos.forEach(photo => {

    const item =
    document.createElement("div");

    item.className =
    "photo";


    const image =
    document.createElement("img");

    image.src =
    photo.thumbnail_url;

    image.alt =
    photo.file_name;

    image.loading =
    "lazy";


    const checkbox =
    document.createElement("input");

    checkbox.type =
    "checkbox";

    checkbox.className =
    "photo-check";

    checkbox.checked =
    photo.selected;


    checkbox.addEventListener(
      "change",
      () => updateSelection(
        photo.id,
        checkbox.checked
      )
    );


    const name =
    document.createElement("div");

    name.className =
    "photo-name";

    name.textContent =
    photo.file_name;


    item.appendChild(image);
    item.appendChild(checkbox);
    item.appendChild(name);

    photosGrid.appendChild(item);

  });

}


/* =========================================
   UPDATE SELECTION
========================================= */

async function updateSelection(
  photoId,
  selected
){

  const {
    error
  } =
  await supabaseClient
    .from("photos")
    .update({
      selected:selected
    })
    .eq("id",photoId);


  if(error){

    console.error(error);

    alert(
      "Pilihan foto gagal disimpan."
    );

  }

}


/* =========================================
   CREATE GALLERY
========================================= */

galleryForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    errorBox.style.display =
    "none";

    successBox.style.display =
    "none";


    if(!currentUser){

      showError(
        "Akun belum siap. Coba refresh halaman."
      );

      return;

    }


    const client =
    clientName.value.trim();

    const name =
    galleryName.value.trim();

    const drive =
    driveUrl.value.trim();


    if(!client){

      showError(
        "Nama client wajib diisi."
      );

      return;

    }


    if(!name){

      showError(
        "Nama galeri wajib diisi."
      );

      return;

    }


    const folderId =
    getDriveFolderId(drive);


    if(!folderId){

      showError(
        "Link Google Drive tidak valid."
      );

      return;

    }


    if(
      GOOGLE_DRIVE_API_KEY ===
      "PASTE_API_KEY_GOOGLE_KAMU_DI_SINI"
    ){

      showError(
        "API Key Google Drive belum dimasukkan."
      );

      return;

    }


    saveBtn.disabled =
    true;

    saveBtn.textContent =
    "Membaca Google Drive...";


    try{

      /* 1. CEK GOOGLE DRIVE */

      const drivePhotos =
      await getDrivePhotos(
        folderId
      );


      /* 2. SIMPAN GALERI */

      const {
        data:gallery,
        error:galleryError
      } =
      await supabaseClient
        .from("galleries")
        .insert({

          photographer_id:
          currentUser.id,

          client_name:
          client,

          gallery_name:
          name,

          drive_url:
          drive

        })
        .select()
        .single();


      if(galleryError){

        throw galleryError;

      }


      /* 3. SIMPAN FOTO */

      await savePhotos(
        gallery.id,
        drivePhotos
      );


      /* 4. TAMPILKAN */

      showSuccess(
        `Galeri berhasil dibuat. ${drivePhotos.length} foto ditemukan.`
      );


      galleryForm.style.display =
      "none";

      photosSection.style.display =
      "block";


      const {
        data:photos,
        error:photosError
      } =
      await supabaseClient
        .from("photos")
        .select("*")
        .eq("gallery_id",gallery.id)
        .order("created_at");


      if(photosError){

        throw photosError;

      }


      renderPhotos(
        photos || []
      );

    }
    catch(error){

      console.error(error);

      showError(
        error.message ||
        "Gagal membuat galeri."
      );

      saveBtn.disabled =
      false;

      saveBtn.textContent =
      "Simpan & Ambil Foto";

    }

  }
);


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  if(
    !confirm(
      "Yakin ingin keluar dari akun Memora?"
    )
  ){
    return;
  }


  await supabaseClient.auth.signOut();

  location.href =
  "auth.html?type=photographer";

}

</script>

</body>
</html>
