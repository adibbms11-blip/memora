<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memora — Akun</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#181818;font-family:Arial,sans-serif}.page{width:min(440px,calc(100% - 32px));margin:auto;padding:95px 0}.brand{text-align:center;font:600 40px Georgia}.intro{text-align:center;color:#777;margin:8px 0 30px}.box{background:#fff;border:1px solid #e2e2de;border-radius:24px;padding:30px;box-shadow:0 20px 50px #0000000b}.label{text-align:center;background:#f0f0ee;border-radius:30px;padding:7px 12px;font-size:12px;font-weight:bold;width:max-content;margin:0 auto 20px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f2f2f0;padding:4px;border-radius:12px;margin-bottom:23px}.tabs button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:bold;color:#777}.tabs .active{background:#181818;color:#fff}.field{margin-bottom:16px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d8d8d3;border-radius:11px;font:inherit}.submit,.google{width:100%;padding:14px;border-radius:11px;font-weight:bold;cursor:pointer}.submit{border:0;background:#181818;color:#fff}.google{margin-top:10px;background:#fff;border:1px solid #d8d8d3}.or{display:flex;align-items:center;gap:10px;color:#aaa;font-size:12px;margin:18px 0}.or:before,.or:after{content:"";height:1px;background:#e5e5e1;flex:1}.foot{text-align:center;color:#777;font-size:13px;margin-top:20px}.foot a,.back a{color:#181818;font-weight:bold}.back{text-align:center;margin-top:20px;font-size:13px}.error{display:none;background:#fff1f1;border:1px solid #f0cccc;color:#a33;padding:10px;border-radius:10px;font-size:12px;margin-bottom:15px}
</style></head><body><main class="page"><div class="brand">memora</div><div class="intro" id="intro">Buat akun untuk mulai membuat galeri.</div><div class="box"><div class="label" id="label">memora</div><div class="tabs"><button id="reg" onclick="mode('register')">Daftar</button><button id="sign" onclick="mode('signin')">Masuk</button></div><div class="error" id="error"></div><form onsubmit="submitForm(event)"><div class="field" id="nameWrap"><label>Nama</label><input id="name" placeholder="Nama kamu"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="nama@email.com" required></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="Minimal 6 karakter" minlength="6" required></div><div class="field" id="confirmWrap"><label>Ulangi Password</label><input id="confirm" type="password" placeholder="Ketik ulang password"></div><button class="submit" id="submit">Buat akun</button></form><div class="or"><span>atau</span></div><button class="google" onclick="google()">Masuk dengan Google</button></div><div class="foot" id="foot"></div><div class="back"><a href="choose.html">← Kembali</a></div></main>
<script>
const q=new URLSearchParams(location.search);let current=q.get('mode')||'register';let type=q.get('type')||localStorage.getItem('memora_account_type')||'photographer';
document.getElementById('label').textContent=type==='photographer'?'memora · for photographers':'memora · for memories';
function mode(m){current=m;document.getElementById('reg').className=m==='register'?'active':'';document.getElementById('sign').className=m==='signin'?'active':'';document.getElementById('nameWrap').style.display=m==='register'?'block':'none';document.getElementById('confirmWrap').style.display=m==='register'?'block':'none';document.getElementById('submit').textContent=m==='register'?'Buat akun':'Masuk';document.getElementById('intro').textContent=m==='register'?'Buat akun untuk mulai membuat galeri.':'Masuk untuk melanjutkan ke Memora.';document.getElementById('foot').innerHTML=m==='register'?'Sudah punya akun? <a href="#" onclick="mode(\'signin\');return false">Masuk di sini</a>':'Belum punya akun? <a href="#" onclick="mode(\'register\');return false">Buat akun</a>'}
function submitForm(e){e.preventDefault();let email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value;if(current==='register'){let name=document.getElementById('name').value.trim(),c=document.getElementById('confirm').value;if(!name)return err('Isi nama kamu dulu.');if(pass.length<6)return err('Password minimal 6 karakter.');if(pass!==c)return err('Password belum sama.')}localStorage.setItem('memora_logged_in','true');localStorage.setItem('memora_user',JSON.stringify({email,type}));location.href=type==='photographer'?'dashboard.html':'memories.html'}
function err(t){let e=document.getElementById('error');e.textContent=t;e.style.display='block'}function google(){alert('Google Sign In akan kita hubungkan ke backend/Supabase pada tahap berikutnya.')}mode(current);
</script></body></html>
