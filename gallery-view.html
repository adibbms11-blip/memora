<!doctype html>
<html lang="id">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Memora — Galeri</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#fafaf8;
  --card:#fff;
  --text:#181818;
  --muted:#77736c;
  --border:#e4e1db;
  --soft:#f2f1ee;
  --accent:#b89558;
}

body.dark{
  --bg:#181817;
  --card:#222220;
  --text:#f5f3ee;
  --muted:#aaa69d;
  --border:#3a3935;
  --soft:#2b2a27;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

/* ================================
   HEADER
================================ */

.header{
  height:68px;
  border-bottom:1px solid var(--border);
  background:var(--bg);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 30px;

  position:sticky;
  top:0;
  z-index:50;
}

.brand{
  font:600 30px Georgia,serif;
  letter-spacing:-1px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.email{
  color:var(--muted);
  font-size:13px;
}

.back-btn{
  border:1px solid var(--border);
  background:var(--card);
  border-radius:10px;
  padding:9px 14px;
  color:var(--text);
  cursor:pointer;
}

.back-btn:hover{
  background:var(--soft);
}

/* ================================
   PAGE
================================ */

.page{
  width:min(1100px,calc(100% - 32px));
  margin:auto;
  padding:55px 0 80px;
}

/* ================================
   HERO
================================ */

.hero{
  margin-bottom:35px;
}

.eyebrow{
  color:var(--accent);
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:10px;
}

h1{
  margin:0;
  font-size:36px;
  letter-spacing:-1.2px;
}

.client{
  margin-top:9px;
  color:var(--muted);
  font-size:14px;
}

.drive-link{
  display:inline-block;
  margin-top:14px;
  color:var(--muted);
  font-size:12px;
  text-decoration:none;
}

.drive-link:hover{
  text-decoration:underline;
}

/* ================================
   STATUS
================================ */

.status{
  padding:14px 16px;
  border-radius:11px;
  font-size:13px;
  margin-bottom:25px;
}

.status.loading{
  background:var(--soft);
  color:var(--muted);
  border:1px solid var(--border);
}

.status.error{
  background:#fff1f1;
  color:#a33;
  border:1px solid #efcccc;
}

.status.success{
  background:#effaf3;
  color:#287a45;
  border:1px solid #c8e8d2;
}

/* ================================
   PHOTO HEADER
================================ */

.photo-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.photo-title{
  font-size:18px;
  font-weight:bold;
}

.photo-count{
  color:var(--muted);
  font-size:13px;
}

/* ================================
   PHOTO GRID
================================ */

.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

/* ================================
   PHOTO
================================ */

.photo{
  position:relative;
  aspect-ratio:1/1;

  background:#eee;

  border-radius:14px;
  overflow:hidden;

  cursor:pointer;

  border:1px solid var(--border);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.photo:hover{
  transform:translateY(-2px);

  box-shadow:
    0 12px 25px
    rgba(0,0,0,.10);
}

.photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  background:#f0f0ed;
}

/* ================================
   PHOTO NAME
================================ */

.photo-name{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:35px 10px 10px;

  color:#fff;
  font-size:11px;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.7)
    );

  opacity:0;

  transition:opacity .2s ease;
}

.photo:hover .photo-name{
  opacity:1;
}

/* ================================
   EMPTY
================================ */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:70px 20px;

  color:var(--muted);

  border:1px solid var(--border);

  border-radius:15px;

  background:var(--card);
}

/* ================================
   LIGHTBOX
================================ */

.lightbox{
  display:none;

  position:fixed;

  inset:0;

  z-index:9999;

  background:rgba(0,0,0,.94);

  align-items:center;
  justify-content:center;

  padding:30px;
}

.lightbox.active{
  display:flex;
}

.lightbox img{
  max-width:95vw;
  max-height:90vh;

  object-fit:contain;

  border-radius:6px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.5);
}

.close-lightbox{
  position:absolute;

  top:20px;
  right:25px;

  width:42px;
  height:42px;

  border:1px solid rgba(255,255,255,.25);

  background:rgba(255,255,255,.1);

  color:#fff;

  border-radius:50%;

  font-size:22px;

  cursor:pointer;
}

.close-lightbox:hover{
  background:rgba(255,255,255,.2);
}

/* ================================
   LOADING PHOTO
================================ */

.photo-loading{
  grid-column:1/-1;

  text-align:center;

  padding:50px;

  color:var(--muted);

  font-size:13px;
}

/* ================================
   RESPONSIVE
================================ */

@media(max-width:900px){

  .photo-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  .header{
    padding:0 18px;
  }

  .brand{
    font-size:25px;
  }

  .email{
    display:none;
  }

  .page{
    padding-top:35px;
  }

  h1{
    font-size:28px;
  }

  .photo-grid{
    grid-template-columns:repeat(2,1fr);
    gap:9px;
  }

  .photo-name{
    opacity:1;
  }

  .lightbox{
    padding:15px;
  }

  .lightbox img{
    max-width:100%;
    max-height:85vh;
  }

}

</style>

</head>

<body>

<!-- =================================
     HEADER
================================= -->

<header class="header">

  <div class="brand">
    memora
  </div>

  <div class="header-right">

    <div
      class="email"
      id="userEmail"
    >
      Memuat...
    </div>

    <button
      class="back-btn"
      onclick="goBack()"
    >
      ← Kembali
    </button>

  </div>

</header>


<!-- =================================
     MAIN
================================= -->

<main class="page">

  <section class="hero">

    <div class="eyebrow">
      Galeri Foto
    </div>

    <h1 id="galleryTitle">
      Memuat galeri...
    </h1>

    <div
      class="client"
      id="clientName"
    >
      Memuat...
    </div>

    <a
      id="driveLink"
      class="drive-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      style="display:none"
    >
      Buka folder Google Drive ↗
    </a>

  </section>


  <!-- STATUS -->

  <div
    id="status"
    class="status loading"
  >
    Menghubungkan ke galeri...
  </div>


  <!-- FOTO -->

  <section>

    <div class="photo-header">

      <div class="photo-title">
        Foto
      </div>

      <div
        class="photo-count"
        id="photoCount"
      >
        0 foto
      </div>

    </div>

    <div
      id="photoGrid"
      class="photo-grid"
    >

      <div class="photo-loading">
        Memuat foto...
      </div>

    </div>

  </section>

</main>


<!-- =================================
     LIGHTBOX
================================= -->

<div
  id="lightbox"
  class="lightbox"
  onclick="closeLightbox(event)"
>

  <button
    class="close-lightbox"
    onclick="closeLightbox()"
    aria-label="Tutup"
  >
    ×
  </button>

  <img
    id="lightboxImage"
    src=""
    alt="Preview foto"
    onclick="event.stopPropagation()"
  >

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://kluuablkxxanpkdsfckp.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_MWrUTn7S0cX1Ff50ebZvFQ_GxtiwiTy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   GOOGLE DRIVE API KEY
===================================================== */

const GOOGLE_DRIVE_API_KEY =
  "AIzaSyCNjhG4YaftIllJoRciPB9b7158WAtT3nA";


/* =====================================================
   ELEMENT
===================================================== */

const galleryTitle =
  document.getElementById("galleryTitle");

const clientName =
  document.getElementById("clientName");

const userEmail =
  document.getElementById("userEmail");

const driveLink =
  document.getElementById("driveLink");

const statusBox =
  document.getElementById("status");

const photoGrid =
  document.getElementById("photoGrid");

const photoCount =
  document.getElementById("photoCount");

const lightbox =
  document.getElementById("lightbox");

const lightboxImage =
  document.getElementById("lightboxImage");


/* =====================================================
   GET GALLERY ID
===================================================== */

function getGalleryId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(message,type){

  statusBox.textContent =
    message;

  statusBox.className =
    "status " + type;

}


/* =====================================================
   AUTH
===================================================== */

async function checkAuth(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();

    if(error){

      throw error;

    }

    const session =
      data.session;

    if(!session){

      window.location.href =
        "auth.html?mode=signin&type=photographer";

      return null;

    }

    userEmail.textContent =
      session.user.email || "";

    return session.user;

  }
  catch(error){

    console.error(
      "AUTH ERROR:",
      error
    );

    showStatus(
      "Gagal mengecek login: " +
      error.message,
      "error"
    );

    return null;

  }

}


/* =====================================================
   LOAD GALLERY
===================================================== */

async function loadGallery(){

  const galleryId =
    getGalleryId();

  if(!galleryId){

    galleryTitle.textContent =
      "Galeri tidak ditemukan";

    clientName.textContent =
      "";

    showStatus(
      "ID galeri tidak ditemukan.",
      "error"
    );

    return;

  }


  const user =
    await checkAuth();

  if(!user){

    return;

  }


  showStatus(
    "Memuat galeri...",
    "loading"
  );


  /* ================================================
     AMBIL DATA GALERI
  ================================================= */

  const {
    data:gallery,
    error:galleryError
  } =
    await supabaseClient
      .from("galleries")
      .select(
        "id,photographer_id,client_name,gallery_name,drive_url,drive_folder_id"
      )
      .eq(
        "id",
        galleryId
      )
      .eq(
        "photographer_id",
        user.id
      )
      .maybeSingle();


  if(galleryError){

    console.error(
      "GALLERY ERROR:",
      galleryError
    );

    showStatus(
      "Gagal mengambil data galeri: " +
      galleryError.message,
      "error"
    );

    return;

  }


  if(!gallery){

    galleryTitle.textContent =
      "Galeri tidak ditemukan";

    clientName.textContent =
      "";

    showStatus(
      "Galeri tidak ditemukan atau kamu tidak memiliki akses.",
      "error"
    );

    return;

  }


  /* ================================================
     TAMPILKAN INFO
  ================================================= */

  galleryTitle.textContent =
    gallery.gallery_name ||
    "Galeri";


  clientName.textContent =
    gallery.client_name ||
    "";


  if(gallery.drive_url){

    driveLink.href =
      gallery.drive_url;

    driveLink.style.display =
      "inline-block";

  }


  /* ================================================
     FOLDER ID
  ================================================= */

  let folderId =
    gallery.drive_folder_id;


  if(!folderId){

    folderId =
      getDriveFolderId(
        gallery.drive_url
      );

  }


  if(!folderId){

    showStatus(
      "Folder Google Drive belum terhubung ke galeri.",
      "error"
    );

    photoGrid.innerHTML =
      `
      <div class="empty">
        Folder Google Drive belum terhubung.
      </div>
      `;

    return;

  }


  /* ================================================
     AMBIL FOTO
  ================================================= */

  showStatus(
    "Mengambil foto dari Google Drive...",
    "loading"
  );


  try{

    const photos =
      await getDrivePhotos(
        folderId
      );


    renderPhotos(
      photos
    );


    showStatus(
      "✓ Galeri berhasil dimuat.",
      "success"
    );

  }
  catch(error){

    console.error(
      "DRIVE ERROR:",
      error
    );

    showStatus(
      "Google Drive gagal diakses: " +
      error.message,
      "error"
    );

    photoGrid.innerHTML =
      `
      <div class="empty">
        Tidak dapat mengambil foto dari Google Drive.
        <br><br>
        ${escapeHtml(error.message)}
      </div>
      `;

  }

}


/* =====================================================
   DRIVE FOLDER ID
===================================================== */

function getDriveFolderId(url){

  if(!url){

    return null;

  }


  const folderMatch =
    url.match(
      /\/folders\/([a-zA-Z0-9_-]+)/
    );


  if(folderMatch){

    return folderMatch[1];

  }


  const idMatch =
    url.match(
      /[?&]id=([a-zA-Z0-9_-]+)/
    );


  if(idMatch){

    return idMatch[1];

  }


  return null;

}


/* =====================================================
   GET GOOGLE DRIVE PHOTOS
===================================================== */

async function getDrivePhotos(folderId){

  const query =
    `'${folderId}' in parents and trashed = false and mimeType contains 'image/'`;


  const fields =
    "files(id,name,mimeType,thumbnailLink,webContentLink,webViewLink),nextPageToken";


  let allFiles = [];

  let pageToken = null;


  do{

    let endpoint =
      "https://www.googleapis.com/drive/v3/files" +
      "?q=" +
      encodeURIComponent(query) +
      "&fields=" +
      encodeURIComponent(fields) +
      "&pageSize=100" +
      "&orderBy=name" +
      "&key=" +
      encodeURIComponent(
        GOOGLE_DRIVE_API_KEY
      );


    if(pageToken){

      endpoint +=
        "&pageToken=" +
        encodeURIComponent(
          pageToken
        );

    }


    const response =
      await fetch(
        endpoint
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result?.error?.message ||
        "Google Drive gagal mengirim foto."
      );

    }


    if(result.files){

      allFiles =
        allFiles.concat(
          result.files
        );

    }


    pageToken =
      result.nextPageToken ||
      null;

  }
  while(pageToken);


  return allFiles;

}


/* =====================================================
   THUMBNAIL
===================================================== */

function getThumbnail(file){

  if(file.thumbnailLink){

    return file.thumbnailLink
      .replace(
        /=s\d+/,
        "=s1200"
      );

  }


  return (
    "https://drive.google.com/thumbnail" +
    "?id=" +
    encodeURIComponent(
      file.id
    ) +
    "&sz=w1200"
  );

}


/* =====================================================
   RENDER PHOTOS
===================================================== */

function renderPhotos(photos){

  photoGrid.innerHTML =
    "";


  photoCount.textContent =
    photos.length +
    " foto";


  if(!photos.length){

    photoGrid.innerHTML =
      `
      <div class="empty">

        Tidak ada foto ditemukan
        di folder Google Drive.

      </div>
      `;

    return;

  }


  photos.forEach(
    function(file){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "photo";


      const image =
        document.createElement(
          "img"
        );


      const thumbnail =
        getThumbnail(
          file
        );


      image.src =
        thumbnail;


      image.alt =
        file.name;


      image.loading =
        "lazy";


      image.onerror =
        function(){

          image.src =
            "https://drive.google.com/thumbnail" +
            "?id=" +
            encodeURIComponent(
              file.id
            ) +
            "&sz=w1600";

        };


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "photo-name";


      name.textContent =
        file.name;


      item.appendChild(
        image
      );


      item.appendChild(
        name
      );


      item.addEventListener(
        "click",
        function(){

          openLightbox(
            thumbnail
          );

        }
      );


      photoGrid.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   LIGHTBOX
===================================================== */

function openLightbox(imageUrl){

  lightboxImage.src =
    imageUrl;


  lightbox.classList.add(
    "active"
  );


  document.body.style.overflow =
    "hidden";

}


function closeLightbox(event){

  if(
    event &&
    event.target ===
      lightboxImage
  ){

    return;

  }


  lightbox.classList.remove(
    "active"
  );


  lightboxImage.src =
    "";


  document.body.style.overflow =
    "";

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
      "Escape"
    ){

      closeLightbox();

    }

  }
);


/* =====================================================
   BACK
===================================================== */

function goBack(){

  window.location.href =
    "gallery.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

loadGallery();

</script>

</body>
</html>
