<!doctype html>
<html lang="id">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Memora — Galeri</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#fafaf8;
  --card:#fff;
  --text:#181818;
  --muted:#77736c;
  --border:#e4e1db;
  --soft:#f2f1ee;
  --accent:#b89558;
}

body.dark{
  --bg:#181817;
  --card:#222220;
  --text:#f5f3ee;
  --muted:#aaa69d;
  --border:#3a3935;
  --soft:#2b2a27;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

/* =========================================
   HEADER
========================================= */

.header{
  height:68px;
  border-bottom:1px solid var(--border);
  background:var(--bg);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 30px;

  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  font:600 30px Georgia,serif;
}

.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.email{
  color:var(--muted);
  font-size:13px;
}

.back-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);

  border-radius:10px;

  padding:9px 14px;

  cursor:pointer;

  transition:.2s;
}

.back-btn:hover{
  border-color:var(--accent);
}


/* =========================================
   PAGE
========================================= */

.page{
  width:min(1100px,calc(100% - 32px));

  margin:auto;

  padding:55px 0 80px;
}


/* =========================================
   HERO
========================================= */

.hero{
  margin-bottom:35px;
}

.eyebrow{
  color:var(--accent);

  font-size:12px;
  font-weight:bold;

  text-transform:uppercase;

  letter-spacing:.08em;

  margin-bottom:10px;
}

h1{
  margin:0;

  font-size:36px;

  letter-spacing:-1.2px;
}

.client{
  margin-top:9px;

  color:var(--muted);

  font-size:14px;
}

.description{
  margin-top:12px;

  color:var(--muted);

  font-size:14px;

  line-height:1.6;

  max-width:700px;
}

.drive-link{
  display:inline-block;

  margin-top:14px;

  color:var(--accent);

  font-size:12px;

  text-decoration:none;
}

.drive-link:hover{
  text-decoration:underline;
}


/* =========================================
   STATUS
========================================= */

.status{
  padding:14px 16px;

  border-radius:11px;

  font-size:13px;

  margin-bottom:25px;
}

.status.loading{
  background:var(--soft);

  color:var(--muted);

  border:1px solid var(--border);
}

.status.error{
  background:#fff1f1;

  color:#a33;

  border:1px solid #efcccc;
}

.status.success{
  background:#effaf3;

  color:#287a45;

  border:1px solid #c8e8d2;
}


/* =========================================
   PHOTO HEADER
========================================= */

.photo-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;
}

.photo-title{
  font-size:18px;

  font-weight:bold;
}

.photo-count{
  color:var(--muted);

  font-size:13px;
}


/* =========================================
   PHOTO GRID
========================================= */

.photo-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;
}


/* =========================================
   PHOTO CARD
========================================= */

.photo{
  position:relative;

  aspect-ratio:1/1;

  background:#eee;

  border-radius:14px;

  overflow:hidden;

  cursor:pointer;

  border:1px solid var(--border);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    border-color .2s ease;
}

.photo:hover{
  transform:translateY(-3px);

  border-color:var(--accent);

  box-shadow:
    0 12px 25px rgba(0,0,0,.1);
}

.photo img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  background:#f0f0ed;

  transition:transform .3s ease;
}

.photo:hover img{
  transform:scale(1.03);
}


/* =========================================
   PHOTO NAME
========================================= */

.photo-name{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:35px 10px 10px;

  color:#fff;

  font-size:11px;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.7)
    );

  opacity:0;

  transition:opacity .2s ease;
}

.photo:hover .photo-name{
  opacity:1;
}


/* =========================================
   EMPTY
========================================= */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:70px 20px;

  color:var(--muted);

  border:1px solid var(--border);

  border-radius:15px;

  background:var(--card);
}


/* =========================================
   LIGHTBOX
========================================= */

.lightbox{
  display:none;

  position:fixed;

  inset:0;

  z-index:9999;

  background:
    rgba(0,0,0,.94);

  align-items:center;

  justify-content:center;

  padding:30px;
}

.lightbox.active{
  display:flex;
}

.lightbox-content{
  position:relative;

  max-width:95vw;
  max-height:90vh;

  display:flex;

  align-items:center;

  justify-content:center;
}

.lightbox img{
  max-width:95vw;
  max-height:88vh;

  object-fit:contain;

  border-radius:6px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.5);
}

.close-lightbox{
  position:absolute;

  top:20px;
  right:25px;

  width:42px;
  height:42px;

  border:1px solid
    rgba(255,255,255,.25);

  background:
    rgba(255,255,255,.1);

  color:#fff;

  border-radius:50%;

  font-size:22px;

  cursor:pointer;

  z-index:10;
}

.close-lightbox:hover{
  background:
    rgba(255,255,255,.2);
}


/* =========================================
   LIGHTBOX NAVIGATION
========================================= */

.lightbox-nav{
  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:48px;
  height:48px;

  border-radius:50%;

  border:1px solid
    rgba(255,255,255,.2);

  background:
    rgba(255,255,255,.1);

  color:#fff;

  font-size:24px;

  cursor:pointer;

  z-index:10;

  transition:.2s;
}

.lightbox-nav:hover{
  background:
    rgba(255,255,255,.2);
}

.lightbox-prev{
  left:20px;
}

.lightbox-next{
  right:20px;
}

.lightbox-name{
  position:absolute;

  bottom:15px;
  left:50%;

  transform:translateX(-50%);

  color:#fff;

  background:
    rgba(0,0,0,.5);

  padding:8px 14px;

  border-radius:20px;

  font-size:12px;

  max-width:70vw;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}


/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

  .photo-grid{
    grid-template-columns:
      repeat(3,1fr);
  }

}

@media(max-width:650px){

  .header{
    padding:0 18px;
  }

  .brand{
    font-size:25px;
  }

  .email{
    display:none;
  }

  .page{
    padding-top:35px;
  }

  h1{
    font-size:28px;
  }

  .photo-grid{
    grid-template-columns:
      repeat(2,1fr);

    gap:9px;
  }

  .photo-name{
    opacity:1;
  }

  .lightbox{
    padding:15px;
  }

  .lightbox-nav{
    width:40px;
    height:40px;

    font-size:18px;
  }

  .lightbox-prev{
    left:10px;
  }

  .lightbox-next{
    right:10px;
  }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

  <div class="brand">
    memora
  </div>


  <div class="header-right">

    <div
      class="email"
      id="userEmail"
    >
      Memuat...
    </div>


    <button
      class="back-btn"
      onclick="goBack()"
    >
      ← Dashboard
    </button>

  </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="page">


  <!-- HERO -->

  <section class="hero">

    <div class="eyebrow">
      Galeri Foto
    </div>


    <h1 id="galleryTitle">
      Memuat galeri...
    </h1>


    <div
      class="client"
      id="clientName"
    >
      Memuat...
    </div>


    <div
      class="description"
      id="galleryDescription"
    ></div>


    <a
      id="driveLink"
      class="drive-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      style="display:none"
    >
      Buka folder Google Drive ↗
    </a>

  </section>



  <!-- STATUS -->

  <div
    id="status"
    class="status loading"
  >
    Menghubungkan ke galeri...
  </div>



  <!-- FOTO -->

  <section>

    <div class="photo-header">

      <div class="photo-title">
        Foto
      </div>


      <div
        class="photo-count"
        id="photoCount"
      >
        0 foto
      </div>

    </div>


    <div
      id="photoGrid"
      class="photo-grid"
    ></div>

  </section>

</main>



<!-- =========================================
     LIGHTBOX
========================================= -->

<div
  id="lightbox"
  class="lightbox"
>

  <button
    class="close-lightbox"
    onclick="closeLightbox()"
    aria-label="Tutup"
  >
    ×
  </button>


  <button
    class="lightbox-nav lightbox-prev"
    onclick="previousPhoto()"
    aria-label="Foto sebelumnya"
  >
    ‹
  </button>


  <div class="lightbox-content">

    <img
      id="lightboxImage"
      src=""
      alt="Preview"
    >

  </div>


  <button
    class="lightbox-nav lightbox-next"
    onclick="nextPhoto()"
    aria-label="Foto berikutnya"
  >
    ›
  </button>


  <div
    id="lightboxName"
    class="lightbox-name"
  ></div>

</div>



<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://kluuablkxxanpkdsfckp.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_MWrUTn7S0cX1Ff50ebZvFQ_GxtiwiTy";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);



/* =========================================
   GOOGLE DRIVE API KEY
========================================= */

const GOOGLE_DRIVE_API_KEY =
"AIzaSyCNjhG4YaftIllJoRciPB9b7158WAtT3nA";



/* =========================================
   ELEMENT
========================================= */

const galleryTitle =
document.getElementById(
  "galleryTitle"
);


const clientName =
document.getElementById(
  "clientName"
);


const galleryDescription =
document.getElementById(
  "galleryDescription"
);


const userEmail =
document.getElementById(
  "userEmail"
);


const driveLink =
document.getElementById(
  "driveLink"
);


const statusBox =
document.getElementById(
  "status"
);


const photoGrid =
document.getElementById(
  "photoGrid"
);


const photoCount =
document.getElementById(
  "photoCount"
);


const lightbox =
document.getElementById(
  "lightbox"
);


const lightboxImage =
document.getElementById(
  "lightboxImage"
);


const lightboxName =
document.getElementById(
  "lightboxName"
);



/* =========================================
   STATE
========================================= */

let photos = [];

let currentPhotoIndex = 0;



/* =========================================
   GET GALLERY ID
========================================= */

function getGalleryId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}



/* =========================================
   STATUS
========================================= */

function showStatus(
  message,
  type
){

  statusBox.textContent =
    message;

  statusBox.className =
    "status " + type;

}



/* =========================================
   AUTH
========================================= */

async function checkAuth(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .auth
      .getSession();


    if(error){

      throw error;

    }


    const session =
      data.session;


    if(!session){

      window.location.href =
        "auth.html?mode=signin&type=photographer";

      return null;

    }


    userEmail.textContent =
      session.user.email || "";


    return session.user;

  }
  catch(error){

    console.error(error);


    showStatus(
      "Gagal mengecek login: " +
      error.message,
      "error"
    );


    return null;

  }

}



/* =========================================
   LOAD GALLERY
========================================= */

async function loadGallery(){

  const galleryId =
    getGalleryId();


  if(!galleryId){

    galleryTitle.textContent =
      "Galeri tidak ditemukan";


    showStatus(
      "ID galeri tidak ditemukan.",
      "error"
    );


    return;

  }


  const user =
    await checkAuth();


  if(!user){

    return;

  }


  showStatus(
    "Memuat galeri...",
    "loading"
  );



  /* =======================================
     AMBIL DATA GALERI
  ======================================= */

  const {
    data:gallery,
    error:galleryError
  } =
  await supabaseClient
    .from("galleries")
    .select(
      "id,photographer_id,client_name,gallery_name,drive_url,drive_folder_id,description"
    )
    .eq(
      "id",
      galleryId
    )
    .eq(
      "photographer_id",
      user.id
    )
    .maybeSingle();


  if(galleryError){

    console.error(
      galleryError
    );


    showStatus(
      "Gagal mengambil data galeri: " +
      galleryError.message,
      "error"
    );


    return;

  }


  if(!gallery){

    galleryTitle.textContent =
      "Galeri tidak ditemukan";


    showStatus(
      "Galeri tidak ditemukan atau kamu tidak memiliki akses.",
      "error"
    );


    return;

  }



  /* =======================================
     TAMPILKAN DATA
  ======================================= */

  galleryTitle.textContent =
    gallery.gallery_name ||
    "Galeri";


  clientName.textContent =
    gallery.client_name ||
    "";


  galleryDescription.textContent =
    gallery.description ||
    "";



  if(gallery.drive_url){

    driveLink.href =
      gallery.drive_url;

    driveLink.style.display =
      "inline-block";

  }



  /* =======================================
     DRIVE FOLDER ID
  ======================================= */

  let folderId =
    gallery.drive_folder_id;


  if(!folderId){

    folderId =
      getDriveFolderId(
        gallery.drive_url
      );

  }


  if(!folderId){

    showStatus(
      "Folder Google Drive belum terhubung.",
      "error"
    );


    return;

  }



  /* =======================================
     AMBIL FOTO DRIVE
  ======================================= */

  showStatus(
    "Mengambil foto dari Google Drive...",
    "loading"
  );


  try{

    photos =
      await getDrivePhotos(
        folderId
      );


    renderPhotos(
      photos
    );


    showStatus(
      "✓ Galeri berhasil dimuat.",
      "success"
    );

  }
  catch(error){

    console.error(
      "DRIVE ERROR:",
      error
    );


    showStatus(
      "Google Drive gagal diakses: " +
      error.message,
      "error"
    );

  }

}



/* =========================================
   GET DRIVE FOLDER ID
========================================= */

function getDriveFolderId(
  url
){

  if(!url){

    return null;

  }


  const folderMatch =
    url.match(
      /\/folders\/([a-zA-Z0-9_-]+)/
    );


  if(folderMatch){

    return folderMatch[1];

  }


  const idMatch =
    url.match(
      /[?&]id=([a-zA-Z0-9_-]+)/
    );


  if(idMatch){

    return idMatch[1];

  }


  return null;

}



/* =========================================
   GET DRIVE PHOTOS
========================================= */

async function getDrivePhotos(
  folderId
){

  const query =
    `'${folderId}' in parents and trashed = false and mimeType contains 'image/'`;


  const fields =
    "files(id,name,mimeType,thumbnailLink,webContentLink,webViewLink),nextPageToken";


  let allFiles = [];

  let pageToken = null;


  do{

    let endpoint =
      "https://www.googleapis.com/drive/v3/files" +
      "?q=" +
      encodeURIComponent(query) +
      "&fields=" +
      encodeURIComponent(fields) +
      "&pageSize=100" +
      "&orderBy=name" +
      "&key=" +
      encodeURIComponent(
        GOOGLE_DRIVE_API_KEY
      );


    if(pageToken){

      endpoint +=
        "&pageToken=" +
        encodeURIComponent(
          pageToken
        );

    }


    const response =
      await fetch(
        endpoint
      );


    const result =
      await response.json();


    if(!response.ok){

      throw new Error(
        result?.error?.message ||
        "Google Drive gagal mengirim foto."
      );

    }


    if(result.files){

      allFiles =
        allFiles.concat(
          result.files
        );

    }


    pageToken =
      result.nextPageToken ||
      null;

  }
  while(pageToken);


  return allFiles;

}



/* =========================================
   GET THUMBNAIL
========================================= */

function getThumbnail(
  file
){

  if(file.thumbnailLink){

    return file.thumbnailLink
      .replace(
        /=s\d+/,
        "=s1600"
      );

  }


  return (
    "https://drive.google.com/thumbnail" +
    "?id=" +
    encodeURIComponent(
      file.id
    ) +
    "&sz=w1600"
  );

}



/* =========================================
   GET LARGE IMAGE
========================================= */

function getLargeImage(
  file
){

  return (
    "https://drive.google.com/thumbnail" +
    "?id=" +
    encodeURIComponent(
      file.id
    ) +
    "&sz=w2400"
  );

}



/* =========================================
   RENDER PHOTOS
========================================= */

function renderPhotos(
  photoFiles
){

  photoGrid.innerHTML =
    "";


  photoCount.textContent =
    photoFiles.length +
    " foto";


  if(!photoFiles.length){

    photoGrid.innerHTML = `

      <div class="empty">

        Tidak ada foto ditemukan
        di folder Google Drive.

      </div>

    `;

    return;

  }


  photoFiles.forEach(
    function(file,index){

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "photo";


      item.dataset.index =
        index;



      const image =
        document.createElement(
          "img"
        );


      const thumbnail =
        getThumbnail(
          file
        );


      image.src =
        thumbnail;


      image.alt =
        file.name;


      image.loading =
        "lazy";



      image.onerror =
        function(){

          image.src =
            getLargeImage(
              file
            );

        };



      const name =
        document.createElement(
          "div"
        );


      name.className =
        "photo-name";


      name.textContent =
        file.name;



      item.appendChild(
        image
      );


      item.appendChild(
        name
      );



      item.addEventListener(
        "click",
        function(){

          openLightbox(
            index
          );

        }
      );


      photoGrid.appendChild(
        item
      );

    }
  );

}



/* =========================================
   OPEN LIGHTBOX
========================================= */

function openLightbox(
  index
){

  if(
    !photos[index]
  ){

    return;

  }


  currentPhotoIndex =
    index;


  const file =
    photos[
      currentPhotoIndex
    ];


  lightboxImage.src =
    getLargeImage(
      file
    );


  lightboxImage.alt =
    file.name;


  lightboxName.textContent =
    file.name;


  lightbox.classList.add(
    "active"
  );


  document.body.style.overflow =
    "hidden";

}



/* =========================================
   CLOSE LIGHTBOX
========================================= */

function closeLightbox(){

  lightbox.classList.remove(
    "active"
  );


  lightboxImage.src =
    "";


  document.body.style.overflow =
    "";

}



/* =========================================
   PREVIOUS PHOTO
========================================= */

function previousPhoto(){

  if(!photos.length){

    return;

  }


  currentPhotoIndex--;


  if(
    currentPhotoIndex < 0
  ){

    currentPhotoIndex =
      photos.length - 1;

  }


  updateLightbox();

}



/* =========================================
   NEXT PHOTO
========================================= */

function nextPhoto(){

  if(!photos.length){

    return;

  }


  currentPhotoIndex++;


  if(
    currentPhotoIndex >=
    photos.length
  ){

    currentPhotoIndex =
      0;

  }


  updateLightbox();

}



/* =========================================
   UPDATE LIGHTBOX
========================================= */

function updateLightbox(){

  const file =
    photos[
      currentPhotoIndex
    ];


  if(!file){

    return;

  }


  lightboxImage.src =
    getLargeImage(
      file
    );


  lightboxImage.alt =
    file.name;


  lightboxName.textContent =
    file.name;

}



/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      !lightbox.classList.contains(
        "active"
      )
    ){

      return;

    }


    if(
      event.key ===
      "Escape"
    ){

      closeLightbox();

    }


    if(
      event.key ===
      "ArrowLeft"
    ){

      previousPhoto();

    }


    if(
      event.key ===
      "ArrowRight"
    ){

      nextPhoto();

    }

  }
);



/* =========================================
   CLICK OUTSIDE IMAGE
========================================= */

lightbox.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      lightbox
    ){

      closeLightbox();

    }

  }
);



/* =========================================
   BACK
========================================= */

function goBack(){

  window.location.href =
    "dashboard.html";

}



/* =========================================
   START
========================================= */

loadGallery();

</script>

</body>
</html>
